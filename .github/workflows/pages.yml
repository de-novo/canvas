name: Deploy Demo Hub to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap optional React peer declarations for clean checkout
        run: |
          pnpm --filter @denovo/canvas-core --filter @denovo/canvas-worker --filter @denovo/canvas-three --filter @denovo/canvas-editor --filter @denovo/canvas-web build
          pnpm --filter @denovo/canvas build || true
          pnpm --filter @denovo/react-canvas build

      - name: Build workspace packages
        run: pnpm build

      - name: Build static Pages demo & benchmark hub
        run: pnpm build:pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
