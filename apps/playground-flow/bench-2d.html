<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Denovo Canvas — 10k 2D Live Benchmark & Smart Snap</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #0b1220;
        color: #e2e8f0;
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100dvh;
        overflow: hidden;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 14px;
        background: #0f172a;
        border-bottom: 1px solid #1e293b;
      }
      .title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        font-weight: 600;
      }
      .title a {
        color: #94a3b8;
        text-decoration: none;
        font-weight: 500;
      }
      .title a:hover { color: #f8fafc; }
      .badge {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        background: #064e3b;
        color: #6ee7b7;
        border: 1px solid #065f46;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      button, select {
        background: #1e293b;
        color: #f8fafc;
        border: 1px solid #334155;
        border-radius: 6px;
        padding: 5px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover, select:hover { border-color: #38bdf8; }
      button.active {
        background: #0284c7;
        border-color: #38bdf8;
      }
      main {
        position: relative;
        min-height: 0;
      }
      #stage {
        width: 100%;
        height: 100%;
      }
      .hud {
        position: absolute;
        left: 12px;
        top: 12px;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 10px 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        line-height: 1.55;
        pointer-events: none;
        min-width: 270px;
      }
      .hud strong { color: #38bdf8; }
      .hud .ok { color: #4ade80; }
    </style>
  </head>
  <body>
    <header>
      <div class="title">
        <a href="../">← Hub</a>
        <span>Denovo Canvas 2D Live Benchmark</span>
        <span class="badge">@de-novo/canvas/2d · Three.js 0B</span>
      </div>
      <div class="controls">
        <select id="node-count" aria-label="Node count">
          <option value="1000">1,000 nodes</option>
          <option value="5000">5,000 nodes</option>
          <option value="10000" selected>10,000 nodes</option>
        </select>
        <button id="btn-pan-burst" type="button">Pan Burst (30 frames)</button>
        <button id="btn-move-one" type="button">Incremental Move (1 node)</button>
        <button id="btn-snap" type="button">O(visible) Smart Snap</button>
        <button id="btn-align" type="button">Align + Distribute (3 nodes)</button>
        <button id="btn-undo" type="button">Undo</button>
      </div>
    </header>
    <main>
      <div id="stage"></div>
      <div id="hud" class="hud" data-testid="bench-hud">Loading 10,000 nodes…</div>
    </main>
    <script type="module" src="/src/bench-2d.ts"></script>
  </body>
</html>
