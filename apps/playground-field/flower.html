<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Denovo Canvas — 3D Parametric Blooming Lotus</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #0a0c14;
        color: #f8fafc;
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100dvh;
        overflow: hidden;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 14px;
        background: rgba(15, 23, 42, 0.96);
        border-bottom: 1px solid #1e293b;
      }
      .title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        font-weight: 600;
      }
      .title a { color: #94a3b8; text-decoration: none; font-weight: 500; }
      .title a:hover { color: #f8fafc; }
      .badge {
        font-size: 11px;
        padding: 2px 9px;
        border-radius: 999px;
        background: #4c0519;
        color: #fda4af;
        border: 1px solid #be123c;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        font-size: 12px;
      }
      label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #cbd5e1;
      }
      button, select {
        background: #1e293b;
        color: #f8fafc;
        border: 1px solid #334155;
        border-radius: 6px;
        padding: 5px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover, select:hover { border-color: #fb7185; }
      button.active {
        background: #be123c;
        border-color: #fb7185;
      }
      main {
        position: relative;
        min-height: 0;
      }
      #stage {
        width: 100%;
        height: 100%;
      }
      .hud {
        position: absolute;
        left: 14px;
        top: 14px;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 10px 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        line-height: 1.55;
        pointer-events: none;
      }
      .hud strong { color: #fb7185; }
    </style>
  </head>
  <body>
    <header>
      <div class="title">
        <a href="../">← Hub</a>
        <span>3D Parametric Blooming Lotus</span>
        <span class="badge">Parametric Mesh + Batched Fibonacci Pollen</span>
      </div>
      <div class="controls">
        <label>
          Bloom
          <input id="bloom-slider" type="range" min="0.25" max="1.15" step="0.05" value="1" />
        </label>
        <select id="palette-select" aria-label="Petal palette">
          <option value="rose" selected>Rose Lotus</option>
          <option value="sakura">Sakura Blush</option>
          <option value="gold">Golden Lotus</option>
          <option value="orchid">Midnight Orchid</option>
        </select>
        <button id="btn-wireframe" type="button">Wireframe: OFF</button>
        <button id="btn-spin" type="button" class="active">Turntable: ON</button>
      </div>
    </header>
    <main>
      <div id="stage"></div>
      <div id="hud" class="hud">Loading parametric lotus…</div>
    </main>
    <script type="module" src="/src/flower.ts"></script>
  </body>
</html>
