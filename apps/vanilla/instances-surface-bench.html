<!DOCTYPE html>
<html>
  <head><meta charset="utf-8" /><title>instances-surface-bench</title></head>
  <body>
    <div id="stage" style="position:fixed;inset:0;"></div>
    <script type="module">
      import { createCanvas } from "@denovo/canvas";

      // Three unit boxes in a row; the centre instance sits at the origin,
      // so a centre-viewport ray must hit index 1 with normal ≈ +z.
      try {
        const requestedBackend = new URLSearchParams(window.location.search).get(
          "backend"
        );
        const runtime = createCanvas(document.getElementById("stage"), {
          ...(requestedBackend === "webgpu"
            ? { renderer: { backend: "webgpu" } }
            : {}),
          scene: {
            background: "#111827",
            camera: { fov: 50, position: [0, 0, 10], target: [0, 0, 0] },
            id: "instances-surface-scene",
            layers: [{ id: "default", name: "Default" }],
            mode: "3d",
            nodes: [
              {
                color: "#38bdf8",
                geometry: "box",
                id: "bench-instances",
                instances: [
                  { position: [-4, 0, 0], rotation: [0, 0, 0], scale: [1, 1, 1] },
                  { position: [0, 0, 0], rotation: [0, 0, 0], scale: [1, 1, 1] },
                  { position: [4, 0, 0], rotation: [0, 0, 0], scale: [1, 1, 1] }
                ],
                layerId: "default",
                position: [0, 0, 0],
                rotation: [0, 0, 0],
                scale: [1, 1, 1],
                type: "instances"
              }
            ],
            render: { frustumCulling: false }
          }
        });

        await runtime.ready;

        const size = runtime.canvas.getBoundingClientRect();
        const centre = [size.width / 2, size.height / 2];

        const resolveAt = (point) =>
          runtime.resolveSurfacePoint({
            mode: "3d",
            target: { kind: "node", nodeType: "instances" },
            viewportPoint: point
          });

        const hit = resolveAt(centre);
        const missProbe = resolveAt([2, 2]);

        const isUnit = (normal) =>
          Math.abs(Math.hypot(normal[0], normal[1], normal[2]) - 1) < 1e-6;

        window.__instancesSurfaceResult =
          hit && hit.kind === "hit" && hit.nodeType === "instances"
            ? {
                hitNodeId: hit.nodeId,
                instanceIndexIsCentre: hit.feature.instanceIndex === 1,
                missOutsideGeometry:
                  missProbe !== undefined && missProbe.kind === "miss",
                normalUnit: isUnit(hit.normal),
                normalFacesCamera:
                  hit.normal[2] > 0.99 &&
                  Math.abs(hit.normal[0]) < 1e-3 &&
                  Math.abs(hit.normal[1]) < 1e-3,
                pointOnCentreBox:
                  Math.abs(hit.point[0]) <= 0.5 &&
                  Math.abs(hit.point[1]) <= 0.5 &&
                  Math.abs(hit.point[2]) <= 0.5
              }
            : { unexpectedResult: JSON.stringify(hit ?? null) };
      } catch (cause) {
        window.__instancesSurfaceError = String(cause);
      }
    </script>
  </body>
</html>
